<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ezyReminder — prototype</title>
<style>
  :root{
    --bg:#F7F6F3; --surface:#FFFFFF; --text:#1A1A1A; --text2:#8A8A8E;
    --hairline:#E5E4E0; --work:#3478F6; --gig:#F5A623; --social:#34C759; --shopping:#AF52DE;
    --danger:#FF3B30; --scrim:rgba(0,0,0,.4);
    --sheet-curve:cubic-bezier(0.32,0.72,0,1);
  }
  .dark{
    --bg:#111113; --surface:#1C1C1F; --text:#F2F2F2; --text2:#98989E;
    --hairline:#2C2C2E; --work:#4C8DFF; --gig:#FFB340; --social:#40D66B; --shopping:#BF5AF2;
    --danger:#FF453A; --scrim:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; background:#d7d5d0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;}
  .dark-page{background:#000;}

  /* phone frame on desktop */
  .frame{max-width:400px; height:100dvh; max-height:860px; margin:0 auto; position:relative;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;}
  @media(min-width:480px){ .frame{margin:24px auto; border-radius:44px; box-shadow:0 24px 80px rgba(0,0,0,.35); border:8px solid #1a1a1a;} }

  /* header */
  header{padding:18px 16px 8px;}
  .titlebar{display:flex; align-items:center; justify-content:space-between;}
  h1{font-size:28px; font-weight:700; margin:0; letter-spacing:-.3px;}
  .gear{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface);color:var(--text2);
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .pills{display:flex; gap:8px; margin-top:12px; overflow-x:auto; scrollbar-width:none;}
  .pills::-webkit-scrollbar{display:none}
  .pill{border:none; background:var(--surface); color:var(--text2); font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:all .18s var(--sheet-curve);
    box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .pill.active{color:#fff; background:var(--text);}
  .pill.active[data-ctx="work"]{background:var(--work)} .pill.active[data-ctx="gig"]{background:var(--gig)}
  .pill.active[data-ctx="social"]{background:var(--social)}

  /* content */
  main{flex:1; overflow-y:auto; padding:8px 16px 140px; overscroll-behavior:contain;}
  .section-h{font-size:13px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; color:var(--text2);
    margin:18px 4px 8px; display:flex; justify-content:space-between; align-items:center;}
  .section-h.danger{color:var(--danger);}
  .card{background:var(--surface); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05);}

  /* rows */
  .rowwrap{position:relative; overflow:hidden; border-bottom:.5px solid var(--hairline);}
  .rowwrap:last-child{border-bottom:none;}
  .row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface);
    position:relative; transition:transform .25s var(--sheet-curve); cursor:pointer; user-select:none;}
  .ring{width:22px; height:22px; min-width:22px; border-radius:50%; border:2px solid var(--text2); cursor:pointer;
    transition:all .2s; display:flex; align-items:center; justify-content:center; color:transparent; font-size:12px;}
  .ring.work{border-color:var(--work)} .ring.gig{border-color:var(--gig)} .ring.social{border-color:var(--social)}
  .ring.done{color:#fff; animation:pop .25s var(--sheet-curve);}
  .ring.done.work{background:var(--work)} .ring.done.gig{background:var(--gig)} .ring.done.social{background:var(--social)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
  .rbody{flex:1; min-width:0;}
  .rtitle{font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rmeta{font-size:13px; color:var(--text2); margin-top:2px; display:flex; gap:6px; align-items:center;}
  .rmeta .due.over{color:var(--danger); font-weight:600;}
  .glyphs{color:var(--text2); opacity:.55; font-size:13px; white-space:nowrap;}
  .badge-warn{font-size:11px;background:var(--gig);color:#fff;border-radius:999px;padding:1px 6px;font-weight:700;}
  .rowwrap.removing .row{transform:translateX(-110%);}
  .rowwrap.removing{animation:collapse .25s .15s forwards;}
  @keyframes collapse{to{max-height:0; opacity:0}}
  .rowwrap{max-height:90px;}
  .swipe-under{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
    background:var(--surface); gap:0;}
  .swipe-under .snz{height:100%; border:none; font-size:12px; font-weight:700; color:#fff; background:#8E8E93; width:64px; cursor:pointer;}
  .swipe-under .snz+.snz{background:#636366;}
  .swipe-under .left{position:absolute; left:0; top:0; bottom:0; display:flex; align-items:center; padding-left:18px;
    color:#fff; font-weight:700; background:var(--social); width:100%; z-index:-1;}

  /* quick add + tab bar */
  .dock{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent, var(--bg) 30%); padding-top:18px;}
  .qa{margin:0 16px 10px; background:var(--surface); border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.12); overflow:hidden;
    transition:all .25s var(--sheet-curve);}
  .qa-bar{display:flex; align-items:center; gap:10px; padding:13px 16px; color:var(--text2); font-size:16px; cursor:text;}
  .qa-plus{color:var(--work); font-size:20px; font-weight:600;}
  .qa input{border:none; outline:none; background:none; color:var(--text); font-size:16px; width:100%; font-family:inherit;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 12px;}
  .chip{font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--bg); color:var(--text2);
    display:flex; gap:4px; align-items:center; animation:chipin .18s var(--sheet-curve);}
  .chip.ctx-work{color:var(--work)} .chip.ctx-gig{color:var(--gig)} .chip.ctx-social{color:var(--social)}
  @keyframes chipin{from{transform:scale(.8); opacity:0}}
  .qa-hint{padding:0 16px 12px; font-size:12px; color:var(--text2);}
  .tabbar{display:flex; background:var(--surface); border-top:.5px solid var(--hairline);
    padding:8px 8px calc(10px + env(safe-area-inset-bottom));}
  .tab{flex:1; border:none; background:none; color:var(--text2); font-size:11px; font-weight:600; cursor:pointer;
    display:flex; flex-direction:column; gap:3px; align-items:center; padding:4px; position:relative;}
  .tab .ic{font-size:21px; line-height:1;}
  .tab.active{color:var(--work);}
  .tab .cnt{position:absolute; top:-2px; right:calc(50% - 22px); background:var(--danger); color:#fff; font-size:10px;
    border-radius:999px; padding:1px 5px; font-weight:700;}

  /* sheet */
  .scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40;}
  .scrim.open{opacity:1; pointer-events:auto;}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:20px 20px 0 0;
    transform:translateY(105%); transition:transform .3s var(--sheet-curve); z-index:50; padding:8px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:86%; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.18);}
  .sheet.open{transform:translateY(0);}
  .handle{width:36px; height:5px; background:var(--hairline); border-radius:99px; margin:6px auto 14px;}
  .sh-title{font-size:20px; font-weight:600; border:none; background:none; color:var(--text); width:100%; outline:none; font-family:inherit;}
  .fieldrow{display:flex; gap:8px; margin:14px 0 4px; flex-wrap:wrap;}
  .fchip{border:none; background:var(--bg); color:var(--text); font-size:13px; font-weight:600; padding:8px 13px;
    border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;} .dot.work{background:var(--work)} .dot.gig{background:var(--gig)} .dot.social{background:var(--social)} .dot.shopping{background:var(--shopping)}
  .sh-notes{width:100%; border:none; background:var(--bg); border-radius:12px; padding:12px; margin-top:12px; color:var(--text);
    font-family:inherit; font-size:14px; resize:none; outline:none;}
  .sh-label{font-size:12px; font-weight:700; letter-spacing:.6px; color:var(--text2); margin:18px 0 8px;}
  .chanrow{display:flex; gap:8px;}
  .chan{flex:1; border:1.5px solid var(--hairline); background:none; border-radius:12px; padding:10px 4px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--text2); text-align:center; transition:all .15s;}
  .chan.on{border-color:var(--work); color:var(--work); background:color-mix(in srgb, var(--work) 8%, transparent);}
  .quiet{font-size:12px; color:var(--text2); margin-top:8px;}
  .orderhead{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
  .switch{width:46px; height:28px; border-radius:99px; background:var(--hairline); border:none; position:relative; cursor:pointer; transition:background .2s;}
  .switch::after{content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff;
    transition:transform .2s var(--sheet-curve); box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on{background:var(--social);} .switch.on::after{transform:translateX(18px);}
  .orderpanel{overflow:hidden; max-height:0; transition:max-height .3s var(--sheet-curve);}
  .orderpanel.open{max-height:340px;}
  .op-in{background:var(--bg); border-radius:14px; padding:14px; margin-top:12px; display:grid; gap:10px;}
  .op-row{display:flex; align-items:center; gap:10px; font-size:14px;}
  .op-row label{width:76px; color:var(--text2); font-size:13px; font-weight:600;}
  .op-row input{flex:1; border:none; background:var(--surface); border-radius:8px; padding:8px 10px; color:var(--text); font-size:14px; outline:none; font-family:inherit;}
  .btn{border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--text); color:var(--bg);}
  .btn.ship{background:var(--gig); color:#fff; width:100%;}
  .sheet-foot{display:flex; justify-content:space-between; margin-top:22px;}
  .btn.ghost-danger{background:none; color:var(--danger); padding:12px 4px;}

  /* Home reuses surface cards, quiet accents, and the shared sheet. */
  .home-card{padding:12px;margin:12px 0;border:1px solid var(--hairline);border-radius:12px;}
  .home-card h3{font-size:17px;margin:0 0 8px;}
  .home-input-row{display:flex;align-items:center;gap:8px;}
  .home-input-row input{flex:1;min-width:0;}
  .home-input-row input,#homeSheet input:not([type=checkbox]),#homeSheet textarea,#homeSheet select{min-height:44px;border:1px solid var(--hairline);border-radius:12px;background:var(--surface);color:var(--text);padding:10px;font:inherit;}
  .home-check,.home-check label{display:flex;align-items:center;gap:8px;min-height:44px;}
  .home-check{justify-content:space-between;}.home-check input{width:22px;height:22px;accent-color:#AF52DE;}
  .home-task{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;min-height:52px;border:0;border-top:1px solid var(--hairline);padding:12px 0;background:none;color:var(--text);font:inherit;cursor:pointer;}
  .home-task span{font-size:13px;color:var(--text2);}
  #homeSheet label{display:flex;flex-direction:column;gap:6px;font-size:14px;margin-top:12px;}
  #homeSheet label.home-check{flex-direction:row;justify-content:flex-start;}
  .home-card .btn,#homeSheet .btn{min-width:44px;min-height:44px;}
  @media(prefers-reduced-motion:reduce){.sheet{transition:none;}}
  /* ship queue */
  .sq-row{padding:14px;}
  .sq-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .sq-ref{font-weight:600; font-size:15px;}
  .sq-by{font-size:12px; font-weight:700; color:var(--text2);} .sq-by.urgent{color:var(--danger);}
  .sq-sub{font-size:13px; color:var(--text2); margin-top:3px;}
  .sq-actions{display:flex; gap:8px; margin-top:10px;}
  .btn.sm{padding:8px 14px; font-size:13px; border-radius:10px;}
  .btn.outline{background:none; border:1.5px solid var(--hairline); color:var(--text);}
  .trackform{display:none; gap:8px; margin-top:10px;}
  .trackform.open{display:flex;}
  .trackform input{flex:1; border:1.5px solid var(--hairline); background:var(--bg); border-radius:10px; padding:9px 10px;
    color:var(--text); font-size:14px; outline:none; font-family:inherit;}

  /* settings */
  .set-group{margin-bottom:6px;}
  .set-row{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; font-size:15px;
    border-bottom:.5px solid var(--hairline); cursor:pointer;}
  .set-row:last-child{border-bottom:none}
  .set-row .v{color:var(--text2); font-size:14px; display:flex; align-items:center; gap:6px;}

  .toast{position:absolute; left:50%; transform:translate(-50%, 20px); bottom:150px; background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; transition:all .3s var(--sheet-curve);
    z-index:60; display:flex; gap:12px; align-items:center; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  .toast button{border:none; background:none; color:var(--gig); font-weight:700; cursor:pointer; font-size:14px; font-family:inherit;}
  .empty{text-align:center; color:var(--text2); font-size:14px; padding:40px 20px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }

  /* ---------- Focus (DESIGN.md §9) ---------- */
  .c-work{--fc:var(--work)} .c-gig{--fc:var(--gig)} .c-social{--fc:var(--social)}
  .fcard{background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:10px;}
  .dark .fcard{box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .f-ctxline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; font-weight:600; color:var(--text2);}
  .f-title{font-size:17px; font-weight:600; margin-top:6px; overflow-wrap:anywhere;}
  .f-meta{font-size:13px; color:var(--text2); margin-top:3px; overflow-wrap:anywhere;}
  .f-note{font-size:12px; color:var(--text2); margin:8px 0 0;}
  .f-inset{background:var(--bg); border-radius:10px; padding:10px 12px; margin-top:10px;}
  .f-inset .k{font-size:12px; font-weight:600; color:var(--text2);}
  .f-inset .v{font-size:14px; margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere;}
  .f-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .f-cardrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .f-count{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.5px;}
  .f-count.dim{color:var(--text2);}
  .f-err{font-size:13px; color:var(--danger); margin:6px 0 0;}
  /* Today Add flow (DESIGN.md §5.1) */
  .add-head{display:flex; align-items:center; gap:4px; margin:0 0 6px;} .add-head h2{font-size:20px; font-weight:600; margin:0;}
  .add-lbl{display:block; font-size:13px; font-weight:600; margin:16px 0 6px;} .add-lbl .f-input{margin-top:6px;}
  #captureSheet .f-trow .t{font-size:15px;}
  .f-link{border:none; background:none; color:var(--text2); font:inherit; font-size:13px; font-weight:600; letter-spacing:.2px; text-transform:none; cursor:pointer; min-height:44px; padding:0 4px; margin:-12px -4px;}
  .fb{min-height:44px; min-width:44px; border:1.5px solid transparent; border-radius:12px; padding:0 16px; font-family:inherit; font-size:15px; font-weight:600; line-height:1.2;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-align:center; color:var(--text); background:none;}
  .fb.primary{background:var(--text); color:var(--bg);}
  .fb.outline{border-color:var(--hairline); background:var(--surface);}
  .fb.ghost{color:var(--text2); padding:0 10px;}
  .fb.block{width:100%;} .fb.grow{flex:1 1 150px;}
  .fb:disabled{opacity:.45; cursor:default;}
  .fb.dur{border-color:var(--hairline); background:var(--surface); color:var(--text2); font-size:13px; padding:0 14px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .fb:focus-visible,.fchip2:focus-visible,.f-choice:focus-visible,.f-icon:focus-visible,.f-link:focus-visible,.f-occ:focus-visible,.f-day:focus-visible,.f-trow:focus-visible,button.set-row:focus-visible{outline:2px solid var(--work); outline-offset:2px;}
  .fchip2{min-height:44px; min-width:44px; padding:0 14px; border-radius:999px; border:1.5px solid var(--hairline); background:var(--surface); color:var(--text2);
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.05); display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .fchip2.on{color:var(--text); border-color:var(--fc,var(--text)); background:color-mix(in srgb, var(--fc,var(--text)) 10%, var(--surface));}
  .f-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .f-grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:12px;}
  .f-missed .f-mh{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .f-missed .f-mt{font-size:15px; font-weight:600;}
  .f-more{font-size:13px; color:var(--text2); font-weight:600;}
  /* focus-time rows */
  .f-occ,.f-trow{display:flex; align-items:center; gap:12px; width:100%; min-height:52px; text-align:left; border:none; background:var(--surface); color:var(--text); font-family:inherit; padding:12px 14px; cursor:pointer; border-bottom:.5px solid var(--hairline);}
  .f-occ:last-child,.f-trow:last-child{border-bottom:none;}
  .f-occ .b,.f-trow .b{flex:1; min-width:0;}
  .f-occ .t,.f-trow .t{font-size:16px; font-weight:600;}
  .f-occ .s{font-size:13px; color:var(--text2); margin-top:2px; overflow-wrap:anywhere;}
  .f-occ .s.hint{font-size:12px;}
  .f-occ .r,.f-trow .r{font-size:13px; color:var(--text2); white-space:nowrap;}
  button.set-row{width:100%; background:none; border:none; color:inherit; font:inherit; font-size:15px; text-align:left; min-height:44px;}
  /* sheets */
  #fSheet{z-index:55;}
  .f-hz{padding:2px 0 0; touch-action:none; cursor:grab;}
  .f-top{display:flex; align-items:center; gap:2px; margin-bottom:6px;}
  .f-h2{flex:1; font-size:20px; font-weight:600; margin:0; overflow-wrap:anywhere;}
  .f-icon{width:44px; height:44px; flex:none; border:none; background:none; color:var(--text2); font-size:20px; cursor:pointer; border-radius:12px; margin-right:-10px;}
  .f-icon.back{margin:0 0 0 -10px; font-size:26px;}
  label.f-sub{display:block;}
  .frame.f-open .toast{bottom:auto; top:64px; transform:translate(-50%,-20px);} .frame.f-open .toast.show{transform:translate(-50%,0);}
  .f-sub{font-size:13px; font-weight:600; color:var(--text2); margin:16px 0 8px;}
  .f-big{display:block; font-size:17px; font-weight:600; margin:20px 0 6px;}
  .f-help{font-size:12px; color:var(--text2); margin:6px 0 0;}
  .f-input,.f-ta{width:100%; min-height:44px; border:1px solid var(--hairline); border-radius:12px; background:var(--surface); color:var(--text); padding:10px 12px; font-family:inherit; font-size:15px; outline:none;}
  .f-ta{background:var(--bg); border-color:transparent; resize:vertical; min-height:72px;}
  .f-input:focus-visible,.f-ta:focus-visible{outline:2px solid var(--work); outline-offset:1px;}
  .f-input[aria-invalid="true"],.f-ta[aria-invalid="true"]{border-color:var(--danger);}
  .f-choice{display:flex; align-items:center; gap:12px; width:100%; min-height:52px; text-align:left; border:1.5px solid var(--hairline); background:var(--surface); color:var(--text);
    border-radius:12px; padding:10px 14px; font-family:inherit; font-size:15px; cursor:pointer; margin-top:8px;}
  .f-choice .sec{display:block; font-size:13px; font-weight:400; color:var(--text2); margin-top:1px;}
  .f-choice .radio{width:20px; height:20px; border-radius:50%; border:2px solid var(--text2); flex:none;}
  .f-choice.on{border-color:var(--fc,var(--text)); background:color-mix(in srgb, var(--fc,var(--text)) 8%, var(--surface));}
  .f-choice.on .radio{border-color:var(--fc,var(--text)); background:radial-gradient(var(--fc,var(--text)) 45%, transparent 50%);}
  .f-choice.plain{justify-content:flex-start;}
  .f-big-count{font-size:56px; font-weight:300; text-align:center; font-variant-numeric:tabular-nums; color:var(--text2); letter-spacing:1px; line-height:1.1; margin-top:22px;}
  .f-big-count.up{color:var(--text); font-weight:600;}
  .f-big-count.paused{opacity:.55;}
  .f-state{text-align:center; font-size:14px; color:var(--text2); margin:4px 0 18px;}

<script>
/* ---------- data ---------- */
const CTX = {work:{name:"Work",cls:"work"}, gig:{name:"Side Gig",cls:"gig"}, social:{name:"Social",cls:"social"}, shopping:{name:"Shopping",cls:"shopping"}};
let reminders = [
 {id:1, title:"Prep talking points for standup", ctx:"work", due:"9:00 AM", over:true,  ch:"📱", section:"overdue"},
 {id:2, title:"Ship mug order to Portland", ctx:"gig", due:"in 2h", ch:"✉ ⧉", order:true, section:"today"},
 {id:3, title:"Send Q3 capacity plan to Priya", ctx:"work", due:"4:00 PM", ch:"📱", section:"today", warn:true},
 {id:4, title:"Call Mom re: weekend plans", ctx:"social", due:"7:30 PM", ch:"⧉", section:"today"},
 {id:5, title:"Restock kraft mailers", ctx:"gig", due:"Tomorrow", ch:"✉", section:"upcoming"},
 {id:6, title:"1:1 agenda for Marcus", ctx:"work", due:"Tue 10 AM", ch:"📱", section:"upcoming"},
 {id:7, title:"RSVP to Dana's party", ctx:"social", due:"Wed", ch:"⧉", section:"upcoming"},
 {id:8, title:"Sticker order · Etsy #1038 · Ben K.", ctx:"gig", due:"ship by Fri", ch:"✉", order:true, section:"today"},
 /* Someday (no due date): used by the Focus samples below; they show in Someday on Today and All */
 {id:9,  title:"Choose photos for mug listing", ctx:"gig", due:"No date", ch:"✉", section:"someday"},
 {id:10, title:"Write listing description", ctx:"gig", due:"No date", ch:"✉", section:"someday"},
 {id:11, title:"Update shipping rates", ctx:"gig", due:"No date", ch:"✉", section:"someday"},
 {id:12, title:"Reply to buyer questions", ctx:"gig", due:"No date", ch:"✉", section:"someday"},
 {id:13, title:"Draft Q4 capacity outline", ctx:"work", due:"No date", ch:"📱", section:"someday"},
];
let orders = [
 {id:"o1", ref:"Etsy #1042 · Sarah M.", sub:"USPS · no label yet", by:"SHIP BY FRI", urgent:true},
 {id:"o2", ref:"Etsy #1038 · Ben K.", sub:"USPS · no label yet", by:"ship by Fri", urgent:true},
 {id:"o3", ref:"Shopify #88 · Priya T.", sub:"UPS Ground", by:"ship by Jul 28"},
];
let doneToday = 3, activeCtx = "all", activeTab = "today";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const main = $("#main");
function h(s){const t=document.createElement("template");t.innerHTML=s.trim();return t.content.firstChild;}
function haptic(){ if(navigator.vibrate) navigator.vibrate(10); }
let toastTimer;
function toast(msg, act, fn){
  $("#toastMsg").textContent = msg;
  const b = $("#toastAct"); b.textContent = act||""; b.onclick = fn||null;
  const t = $("#toast"); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 3500);
}

/* ---------- render: rows ---------- */
function rowHTML(r){
  const c = CTX[r.ctx];
  return `<div class="rowwrap" data-id="${r.id}">
    <div class="swipe-under">
      <div class="left">✓ Done</div>
      <button class="snz" data-snz="1h">1h</button>
      <button class="snz" data-snz="Tonight">🌙</button>
      <button class="snz" data-snz="Tomorrow">→1d</button>
    </div>
    <div class="row">
      <div class="ring ${c.cls}" title="Complete">✓</div>
      <div class="rbody">
        <div class="rtitle">${r.title}</div>
        <div class="rmeta"><span class="due ${r.over?"over":""}">${r.over?"2h overdue":r.due}</span>·<span>${c.name}</span>
        ${r.warn?'<span class="badge-warn">⚠ retry</span>':""}</div>
      </div>
      <div class="glyphs">${r.order?"🚚 ":""}${r.ch}</div>
    </div>
  </div>`;
}
function section(title, rows, opts={}){
  if(!rows.length) return "";
  return `<div class="section-h ${opts.danger?"danger":""}"><span>${title}</span>${opts.count?`<span>${opts.count}</span>`:""}</div>
    <div class="card">${rows.map(rowHTML).join("")}</div>`;
}
function visible(){ return reminders.filter(r => activeTab==="today" || activeCtx==="all" || r.ctx===activeCtx); }

/* ---------- screens ---------- */
function renderToday(){
  const v = visible();
  main.innerHTML = focusTodayHTML() +
    section("Overdue", v.filter(r=>r.section==="overdue"), {danger:true}) +
    section("Today", v.filter(r=>r.section==="today")) +
    section("Upcoming", v.filter(r=>r.section==="upcoming")) +
    section("Someday", v.filter(r=>r.section==="someday")) +
    `<div class="section-h"><span>Done today</span><span>${doneToday} ›</span></div>`;
  if(!v.length) main.innerHTML = focusTodayHTML() + `<div class="empty">All clear. Add a reminder when something comes to mind.</div>`;
  bindRows();
}
function renderShip(){
  main.innerHTML = `<a href="sidegig-prototype.html" class="fdemo" style="display:flex;align-items:center;min-height:44px;padding:10px 12px;text-decoration:none;color:var(--text2)">Prototype proposal · Explore the Side Gig tab ↗</a><div class="section-h"><span>Ship queue</span><span>${orders.length}</span></div>
   <div class="card">${orders.map(o=>`
     <div class="rowwrap"><div class="sq-row" data-oid="${o.id}">
       <div class="sq-top"><span class="sq-ref">${o.urgent?"⚠ ":""}${o.ref}</span><span class="sq-by ${o.urgent?"urgent":""}">${o.by}</span></div>
       <div class="sq-sub">${o.sub}</div>
       <div class="sq-actions">
         <button class="btn sm ship markship">Mark shipped</button>
         <button class="btn sm outline" onclick="toast('Shippo integration — coming in Phase 7')">Buy label</button>
       </div>
       <div class="trackform"><input placeholder="Tracking # (paste)"><button class="btn sm primary confirmship">Save</button></div>
     </div></div>`).join("")}</div>
   <div class="section-h"><span>Shipped this week</span><span>2 ›</span></div>`;
  main.querySelectorAll(".markship").forEach(b=>b.onclick = e=>{
    const f = e.target.closest(".sq-row").querySelector(".trackform"); f.classList.toggle("open");
    f.querySelector("input").focus();
  });
  main.querySelectorAll(".confirmship").forEach(b=>b.onclick = e=>{
    const rowEl = e.target.closest(".rowwrap"), id = rowEl.querySelector(".sq-row").dataset.oid;
    orders = orders.filter(o=>o.id!==id); haptic();
    rowEl.classList.add("removing");
    setTimeout(()=>{ renderShip(); updateShipCnt();
      toast("Shipped ✓ — follow up with buyer?", "+3d follow-up", ()=>toast("Follow-up reminder added ✓")); }, 400);
  });
}
function renderAll(){
  const v = visible();
  main.innerHTML = `<div class="card" style="margin-top:10px; padding:10px 14px; display:flex; gap:8px; align-items:center;">
      <span style="color:var(--text2)">🔍</span><input id="searchIn" placeholder="Search reminders" style="border:none;background:none;outline:none;color:var(--text);font-size:15px;width:100%;font-family:inherit;"></div>` +
    ["work","gig","social","shopping"].map(k=>{
      const rows = v.filter(r=>r.ctx===k); if(!rows.length) return "";
      return section(CTX[k].name, rows);
    }).join("");
  bindRows();
  const si = $("#searchIn");
  if(si) si.oninput = e=>{
    const q = e.target.value.toLowerCase();
    main.querySelectorAll(".rowwrap[data-id]").forEach(w=>{
      w.style.display = w.querySelector(".rtitle").textContent.toLowerCase().includes(q) ? "" : "none";
    });
  };
}
function renderSettings(){
  main.innerHTML = `
  <div class="section-h"><span>Contexts</span></div>
  <div class="card set-group">
    <div class="set-row"><span><span class="dot work" style="display:inline-block;margin-right:8px"></span>Work</span><span class="v">iPhone · quiet 7p–8a ›</span></div>
    <div class="set-row"><span><span class="dot gig" style="display:inline-block;margin-right:8px"></span>Side Gig</span><span class="v">Email · quiet 9p–8a ›</span></div>
    <div class="set-row"><span><span class="dot social" style="display:inline-block;margin-right:8px"></span>Social</span><span class="v">WhatsApp ›</span></div>
  </div>
  <div class="section-h"><span>Channels</span></div>
  <div class="card set-group">
    <div class="set-row"><span>✉ Email</span><span class="v" style="color:var(--social)">Connected ✓</span></div>
    <div class="set-row"><span>📱 iPhone notifications</span><span class="v" style="color:var(--social)">On ✓</span></div>
    <div class="set-row"><span>⧉ WhatsApp</span><span class="v">14 msgs this month ›</span></div>
  </div>
  <div class="section-h"><span>Focus</span></div>
  <div class="card set-group">
    <button class="set-row" data-fact="times"><span>Focus times</span><span class="v">${focusTimes.filter(f=>!f.archived).length ? focusTimes.filter(f=>!f.archived).length+" set up" : "None yet"} ›</span></button>
  </div>
  <div class="section-h"><span>API &amp; Agents</span></div>
  <div class="card set-group">
    <div class="set-row"><span>API keys</span><span class="v">2 active ›</span></div>
    <div class="set-row"><span>✦ claude-cowork</span><span class="v">3 reminders this week ›</span></div>
    <div class="set-row"><span>MCP setup</span><span class="v">Copy snippet ›</span></div>
  </div>
  <div class="section-h"><span>Appearance</span></div>
  <div class="card set-group">
    <div class="set-row" id="darkToggle"><span>Dark mode</span><span class="v" id="darkVal">System ›</span></div>
  </div>`;
  $("#darkToggle").onclick = ()=>{
    document.getElementById("frame").classList.toggle("dark");
    document.body.classList.toggle("dark-page");
    $("#darkVal").textContent = document.getElementById("frame").classList.contains("dark") ? "Dark ›" : "Light ›";
  };
}

/* ---------- row behaviors: complete, swipe, sheet ---------- */
function completeRow(wrap){
  const ring = wrap.querySelector(".ring"); ring.classList.add("done"); haptic();
  setTimeout(()=>{ wrap.classList.add("removing"); }, 200);
  setTimeout(()=>{
    const id = +wrap.dataset.id;
    const r = reminders.find(x=>x.id===id);
    reminders = reminders.filter(x=>x.id!==id); doneToday++;
    render(); toast("Completed ✓", "Undo", ()=>{ reminders.push(r); doneToday--; render(); $("#toast").classList.remove("show"); });
  }, 500);
}
function bindRows(){
  main.querySelectorAll(".rowwrap[data-id]").forEach(wrap=>{
    const row = wrap.querySelector(".row"), ring = wrap.querySelector(".ring");
    ring.onclick = e=>{ e.stopPropagation(); completeRow(wrap); };
    wrap.querySelectorAll(".snz").forEach(b=>b.onclick = e=>{ e.stopPropagation();
      row.style.transform=""; toast(`Snoozed until ${b.dataset.snz==="1h"?"in 1 hour":b.dataset.snz.toLowerCase()} ⏰`); });
    /* pointer swipe */
    let x0=null, dx=0;
    row.addEventListener("pointerdown", e=>{ x0=e.clientX; row.style.transition="none"; });
    row.addEventListener("pointermove", e=>{
      if(x0===null) return; dx=e.clientX-x0;
      if(Math.abs(dx)>6) row.style.transform=`translateX(${dx}px)`;
    });
    row.addEventListener("pointerup", ()=>{
      row.style.transition="";
      if(dx>90){ completeRow(wrap); }
      else if(dx<-70){ row.style.transform="translateX(-192px)"; }   /* reveal snooze */
      else { row.style.transform=""; if(Math.abs(dx)<6) openSheet(wrap.dataset.id); }
      x0=null; dx=0;
    });
    row.addEventListener("pointerleave", ()=>{ if(x0!==null){row.style.transition=""; row.style.transform=""; x0=null;} });
  });
}

/* ---------- sheet ---------- */
function openSheet(id){
  const r = reminders.find(x=>x.id==id); if(!r) return;
  $("#sheet").dataset.rid=r.id;
  $("#shTitle").value = r.title;
  $("#sheet .sh-notes").value=r.notes||"";
  $("#shGigDetails").hidden=r.ctx!=="gig";
  $("#shNextStep").value=r.nextStep||"";
  $("#shMinutes").value=r.minutes||"15";
  const c = CTX[r.ctx];
  $("#shCtx").innerHTML = `<span class="dot ${c.cls}"></span>${c.name}`;
  $("#shDue").textContent = "⏰ " + (r.over ? "9:00 AM (overdue)" : r.due);
  const sw = $("#orderSwitch"), op = $("#orderPanel");
  sw.classList.toggle("on", !!r.order); op.classList.toggle("open", !!r.order);
  syncSheetFocus(r);
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
$("#scrim").onclick = closeSheet;
$("#sheetDone").onclick = ()=>{ const r=reminders.find(r=>r.id===$("#sheet").dataset.rid*1);if(r){r.title=$("#shTitle").value.trim()||r.title;r.notes=$("#sheet .sh-notes").value;r.nextStep=$("#shNextStep").value;r.minutes=$("#shMinutes").value;r.order=$("#orderSwitch").classList.contains("on");} closeSheet();render();toast("Saved ✓"); };
$("#orderSwitch").onclick = function(){ this.classList.toggle("on"); $("#orderPanel").classList.toggle("open"); haptic(); };
$("#shipFromSheet").onclick = ()=>{ closeSheet(); toast("Shipped ✓ — follow up with buyer?", "+3d follow-up", ()=>toast("Follow-up reminder added ✓")); };
document.querySelectorAll(".chan").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
/* sheet drag-to-dismiss */
(function(){
  const sheet = $("#sheet"); let y0=null, dy=0;
  sheet.addEventListener("pointerdown", e=>{ if(sheet.scrollTop>0) return; y0=e.clientY; sheet.style.transition="none"; });
  sheet.addEventListener("pointermove", e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); sheet.style.transform=`translateY(${dy}px)`; });
  const end = ()=>{ if(y0===null) return; sheet.style.transition="";
    if(dy>120) closeSheet(); sheet.style.transform=""; y0=null; dy=0; };
  sheet.addEventListener("pointerup", end); sheet.addEventListener("pointercancel", end);
})();

/* ---------- quick add parsing ---------- */
const DAYS = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function parseQA(text){
  const chips = []; let ctx=null, order=false, chans=[], due=null;
  const t = text.toLowerCase();
  const cm = t.match(/#(work|gig|sidegig|social)/); if(cm){ ctx = cm[1]==="sidegig"?"gig":cm[1]; }
  if(/#order/.test(t)) order = true;

  if(dm){
    let label = dm[1][0].toUpperCase()+dm[1].slice(1);
    if(dm[3]) label += ` ${dm[3]}${dm[5]?":"+dm[5]:":00"} ${(dm[6]||"pm").toUpperCase()}`;
    due = label;
  }
  if(due) chips.push({t:"⏰ "+due});
  if(ctx) chips.push({t:"● "+CTX[ctx].name, cls:"ctx-"+ctx});
  if(order) chips.push({t:"🚚 Order"});
  chans.forEach(c=>chips.push({t:{email:"✉ Email",iphone:"📱 iPhone",whatsapp:"⧉ WhatsApp"}[c]}));
  return {chips, ctx, order, due, chans};
}

/* ----- sessions ----- */
function startSession({rid,minutes,intended,assignId}){
  if(fstate.session){ openF("session"); return; }
  const r = remById(rid);
  fstate.session = {rid, title:r.title, ctx:r.ctx, total:minutes*60, remaining:minutes*60, state:"running", intended:(intended||"").trim(), assignId:assignId||null, minutes};
  if(assignId){ const a = assigns.find(x=>x.id===assignId); if(a) a.state = "in_progress"; }
  fAnnounce(`Focus started, ${minutes} minutes`); syncAll(); openF("session");
}
setInterval(()=>{
  const s = fstate.session; if(!s || s.state!=="running") return;
  s.remaining = Math.max(0,s.remaining-1);
  if(s.remaining===0){ s.state = "timeup"; fAnnounce("Time is up. How did it go?"); syncAll(); return; }
  document.querySelectorAll("[data-fcount]").forEach(e=>e.textContent = fmmss(s.remaining));
},1000);

function renderF(keep){

(function(){   /* drag the handle zone down to dismiss */
  const el = fEl(); let y0 = null, dy = 0;
  el.addEventListener("pointerdown", e=>{ if(!e.target.closest(".f-hz")) return; y0 = e.clientY; el.style.transition = "none"; });
  el.addEventListener("pointermove", e=>{ if(y0===null) return; dy = Math.max(0,e.clientY-y0); el.style.transform = `translateY(${dy}px)`; });
  const end = ()=>{ if(y0===null) return; el.style.transition = ""; el.style.transform = ""; if(dy>100) closeF(); y0 = null; dy = 0; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
})();

/* Work on this: picker with plain choices, minutes, plan note, deadline warning */
function planInit(rid){ return {rid, sel:null, mins:"15", custom:"", pickOpen:false, otherDate:null, otherTime:"18:30", calY:2026, calM:9, tried:false, anyway:false}; }
function planOptions(r){
  const out = [];
  focusTimes.filter(f=>!f.archived && f.ctx===r.ctx).forEach(f=>{
    for(let i=0;i<28;i++){
      const day = new Date(2026,9,23+i); if(!f.days.includes(isoDow(day))) continue;
      const start = fdate(fiso(day),f.time); if(start.getTime()+f.budget*60000<=F_NOW.getTime()) continue;
      out.push({key:`${f.id}|${fiso(day)}`, ftId:f.id, ft:f, date:fiso(day), time:f.time, start});
    }
  });
  return out.sort((a,b)=>a.start-b.start).slice(0,4);
}
function planTarget(d,opts){
  if(d.sel==="other") return d.otherDate ? {ftId:null, ft:null, date:d.otherDate, time:d.otherTime, start:fdate(d.otherDate,d.otherTime)} : null;
  return opts.find(o=>o.key===d.sel) || null;
}
function vPlan(){
  const d = fs.data, r = remById(d.rid), c = CTX[r.ctx].cls, opts = planOptions(r), target = planTarget(d,opts);

  const mins = fMins(d.mins,d.custom), warn = !!(target && due && target.start>due.d);

  const otherSec = d.otherDate && !d.pickOpen ? `${fshort(fdate(d.otherDate))} · ${ft12(d.otherTime)}` : "Choose a date and time";
  let detail = "";
  if(target){
    let sum = "";
    if(target.ftId){
      const others = assigns.filter(a=>a.state==="planned" && a.ftId===target.ftId && a.date===target.date && a.time===target.time && a.rid!==r.id), used = others.reduce((s,a)=>s+a.min,0)+(isNaN(mins)?0:mins), ft = target.ft;
      sum = `<p class="f-meta">${others.length?`Also planned here: ${others.map(a=>fesc(remById(a.rid).title)+" · "+a.min+" min").join(", ")}.<br>`:""}${others.length+1} task${others.length?"s":""} · ${used} min planned${used>ft.budget?` — ${used} min planned for ${ft.budget} min available`:""}</p>`;

      ${d.mins==="custom"?`<input class="f-input" style="margin-top:8px" data-bind="custom" type="number" min="1" max="180" step="1" inputmode="numeric" aria-label="Planned minutes, 1 to 180" value="${fesc(d.custom)}" aria-invalid="${d.tried&&isNaN(mins)}">`:""}
      ${d.tried && isNaN(mins)?'<p class="f-err" role="alert">Choose a whole number from 1 to 180 minutes.</p>':""}${sum}`;
  }
  const noTimes = !opts.length;
  return fHead("Work on this") + remBlock(r) + (cur?`<div class="f-inset"><div class="k">Currently planned</div><div class="v">${assignName(cur)} · ${cur.min} min. Choosing another time moves it.</div></div>`:"")
    + `<div class="f-sub" id="fWhen">When</div><div role="radiogroup" aria-labelledby="fWhen">${rows}
    <button type="button" class="f-choice c-${c} ${d.sel==="other"?"on":""}" role="radio" aria-checked="${d.sel==="other"}" data-act="plan-other"><span class="radio"></span><span><b>Pick another day</b><span class="sec">${otherSec}</span></span><span style="margin-left:auto;color:var(--text2)">${d.pickOpen?"⌃":"›"}</span></button>
    ${d.sel==="other" && d.pickOpen ? vPicker(d) : ""}
    <button type="button" class="f-choice c-${c} ${d.sel==="none"?"on":""}" role="radio" aria-checked="${d.sel==="none"}" data-act="plan-none"><span class="radio"></span><span><b>Keep unscheduled</b><span class="sec">No focus time for now</span></span></button></div>
    ${noTimes?`<p class="f-note">You haven't set up a ${CTX[r.ctx].name} focus time yet. <u data-act="goto-times" style="cursor:pointer">Set my focus times</u></p>`:""}
    ${detail}
    ${warn?`<div class="f-warn" role="alert"><b>This is after the ${due.order?"ship-by":"due"} time</b><p>${fdueText(r.id)}. Your deadline stays the same.</p>
      <div class="f-actions"><button class="fb outline" data-act="plan-earlier">Choose an earlier time</button><button class="fb primary" data-act="plan-anyway">Plan it anyway</button></div></div>`
      : `${d.tried && !target && d.sel!=="none"?`<p class="f-err" role="alert">${d.sel==="other"?"Choose a day and time, then tap OK.":"Choose when you'd like to work on this."}</p>`:""}<button class="fb primary block" style="margin-top:16px" data-act="plan-save">Save plan</button>`}`;
}
function vPicker(d){

  for(let i=0;i<first.getDay();i++) cells += "<span></span>";

    <div class="f-cal">${["S","M","T","W","T","F","S"].map(x=>`<span class="f-dow" aria-hidden="true">${x}</span>`).join("")}${cells}</div>
    <div class="f-time-row"><label for="fPickTime">Time</label><input class="f-input" id="fPickTime" type="time" data-bind="otherTime" value="${d.otherTime}"></div>
    ${d.pickErr?'<p class="f-err" role="alert">Choose a day first.</p>':""}<button type="button" class="fb primary block" data-act="pick-ok">OK</button></div>`;
}

/* Focus times (manage) */
const fDays = days => { const s = [...days].sort().join(); return s==="1,2,3,4,5"?"Weekdays":s==="6,7"?"Weekends":days.length===1?DAYN[days[0]%7]:[...days].sort().map(n=>DAYN[n%7].slice(0,3)).join(", "); };
function vTimes(){
  const live = focusTimes.filter(f=>!f.archived);
  return fHead("Your focus times") + (live.length ? `<div class="card" style="border:1px solid var(--hairline);box-shadow:none;margin-top:6px">${live.map(f=>`<button class="f-trow" data-act="edit-time" data-id="${f.id}"><span class="dot ${CTX[f.ctx].cls}" aria-hidden="true"></span><span class="b"><div class="t" style="font-size:15px">${fesc(f.label||fDays(f.days))}</div><div class="s" style="font-size:13px;color:var(--text2)">${fDays(f.days)} · ${ft12(f.time)} · ${f.budget} min</div></span><span class="r">›</span></button>`).join("")}</div>`
    : '<p class="f-meta" style="font-size:14px;margin:6px 0 0">Pick the weekly times you can focus, then plan reminders into them. Nothing starts on its own.</p>')
    + `<p class="f-tz">Times use your account timezone, ${F_TZ}. <u data-act="tz">Change in Settings</u></p><button class="fb primary block" style="margin-top:16px" data-act="add-time">Add a focus time</button>`;
}
function tdInit(f){
  return f ? {id:f.id,label:f.label||"",days:[...f.days],time:f.time,mins:[15,30,60].includes(f.budget)?String(f.budget):"custom",custom:String(f.budget),ctx:f.ctx,timeOpen:false,err:{}}
           : {id:null,label:"",days:[],time:"09:00",mins:"30",custom:"",ctx:null,timeOpen:false,err:{}};
}
function vTimeEdit(){
  const d = fs.data, e = d.err, WD = [[1,"Mon","Monday"],[2,"Tue","Tuesday"],[3,"Wed","Wednesday"],[4,"Thu","Thursday"],[5,"Fri","Friday"],[6,"Sat","Saturday"],[7,"Sun","Sunday"]], c = d.ctx ? CTX[d.ctx].cls : "";
  return fHead(d.id?"Edit focus time":"New focus time",true)
    + `<label class="f-sub" for="fLabel">Name <span style="font-weight:400">(optional)</span></label><input class="f-input" id="fLabel" data-bind="label" maxlength="40" placeholder="e.g. Shop time" value="${fesc(d.label)}">
    <div class="f-sub" id="fDaysL">Days</div><div class="f-days" role="group" aria-labelledby="fDaysL">${WD.map(([n,s,full])=>`<button type="button" class="fchip2 c-${c||"work"} ${d.days.includes(n)?"on":""}" aria-pressed="${d.days.includes(n)}" aria-label="${full}" data-act="td-day" data-v="${n}">${s}</button>`).join("")}</div>
    ${e.days?`<p class="f-err" role="alert">${e.days}</p>`:""}
    <div class="f-sub">Time</div><button type="button" class="fchip2" data-act="td-time" aria-expanded="${d.timeOpen}">⏰ ${ft12(d.time)}</button>
    ${d.timeOpen?`<div class="f-picker"><div class="f-time-row" style="margin-top:2px"><label for="fTdTime">Start time</label><input class="f-input" id="fTdTime" type="time" data-bind="time" value="${d.time}"></div><button type="button" class="fb primary block" data-act="td-time-ok">OK</button></div>`:""}
    <p class="f-tz">Account timezone: ${F_TZ}. <u data-act="tz">Change in Settings</u></p>
    <div class="f-sub" id="fHaveL">I usually have</div>${durChips(["15","30","60","custom"],d.mins,c||"work","td-mins")}
    ${d.mins==="custom"?`<input class="f-input" style="margin-top:8px" data-bind="custom" type="number" min="1" max="180" step="1" inputmode="numeric" aria-label="Minutes available, 1 to 180" value="${fesc(d.custom)}" aria-invalid="${!!e.mins}">`:""}
    ${e.mins?`<p class="f-err" role="alert">${e.mins}</p>`:""}
    <div class="f-sub" id="fCtxL">For</div><div class="f-seg" role="radiogroup" aria-labelledby="fCtxL">${["work","gig"].map(k=>`<button type="button" class="fchip2 c-${CTX[k].cls} ${d.ctx===k?"on":""}" role="radio" aria-checked="${d.ctx===k}" data-act="td-ctx" data-v="${k}">${fDot(k)}${CTX[k].name}</button>`).join("")}</div>
    ${e.ctx?`<p class="f-err" role="alert">${e.ctx}</p>`:""}
    <p class="f-help">Changes apply to future choices. Work you've already planned keeps its time.</p>
    <button class="fb primary block" style="margin-top:16px" data-act="td-save">Save focus time</button>
    ${d.id?'<button class="fb ghost block" style="margin-top:4px;color:var(--danger)" data-act="td-archive">Archive</button>':""}`;
}

/* ----- sheet event handling ----- */
fEl().addEventListener("input", e=>{
  const k = e.target.dataset.bind; if(!k) return; fs.data[k] = e.target.value;
  if(k==="q") $("#fChooseList").innerHTML = chooseRows(fs.data.q.toLowerCase());
  if(k==="custom" && fs.mode==="setup") renderFSetupNote();
});
function renderFSetupNote(){ /* keep the caret in the custom field: only refresh the “saves as usual length” note */
  const d = fs.data, val = fMins(d.mins,d.custom), el = fEl().querySelector(".f-note"), msg = !isNaN(val) && val!==fstate.pref ? `Starting with ${val} min saves it as your usual length.` : "";
  if(el){ el.textContent = msg; el.style.display = msg?"":"none"; }
}
fEl().addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return; const a = b.dataset.act, v = b.dataset.v, d = fs.data;
  switch(a){
    case "close": closeF(); break;
    case "back": goF("times"); break;
    case "open-session": goF("session"); break;
    case "pick-focus": { const r = remById(+b.dataset.id); fstate.highlight = {rid:r.id}; closeF(); syncAll(); toast("Today's focus set"); fAnnounce("Today's focus set"); break; }
    /* setup */
    case "setup-dur": d.mins = v; d.tried = false; renderF(true); break;
    case "setup-start": { const val = fMins(d.mins,d.custom); if(isNaN(val)){ d.tried = true; renderF(true); break; }
      fstate.pref = val; startSession({rid:d.rid, minutes:val, intended:d.intended, assignId:d.assignId}); break; }
    /* session */
    case "pause": fstate.session.state = "paused"; fAnnounce("Session paused"); syncAll(); break;
    case "resume": fstate.session.state = "running"; fAnnounce("Session resumed"); syncAll(); break;
    case "review": goF("review",{outcome:null,next:"",tried:false,failed:false}); break;
    case "outcome": d.outcome = v; renderF(true); break;
    case "save-review": {
      if(!d.outcome){ d.tried = true; renderF(true); break; }
      if(demo.fail){ demo.fail = false; d.failed = true; renderF(true); break; }
      const s = fstate.session, mins = Math.max(1,Math.round((s.total-s.remaining)/60)), next = (d.next||"").trim();
      fNext[s.rid] = next;                                         /* latest saved note wins — a blank note clears the old one */
      if(s.assignId){ const as = assigns.find(x=>x.id===s.assignId); if(as) as.state = "reviewed"; }
      fstate.lastSaved = {rid:s.rid, title:s.title, outcome:d.outcome, mins, next, ctx:s.ctx};
      fstate.session = null; fAnnounce("Session saved"); syncAll(); goF("after"); toast("Session saved"); break; }
    /* after save */
    case "continue": { const L = fstate.lastSaved; closeF(); startSession({rid:L.rid, minutes:10, intended:L.next}); break; }
    case "another": goF("plan",planInit(fstate.lastSaved.rid)); break;
    case "done-now": closeF(); break;
    case "mark-done": { const L = fstate.lastSaved, r = remById(L.rid); reminders = reminders.filter(x=>x.id!==L.rid); doneToday++;
      if(fstate.highlight && fstate.highlight.rid===L.rid) fstate.highlight = null; closeF(); syncAll();
      toast("Reminder marked done ✓","Undo",()=>{ reminders.push(r); doneToday--; syncAll(); $("#toast").classList.remove("show"); }); break; }
    case "ship-it": { const rid = fstate.lastSaved.rid; closeF(); openSheet(rid); break; }
    /* occurrence */
    case "occ-start": { const as = assigns.find(x=>x.id===b.dataset.id); closeF(); startSession({rid:as.rid, minutes:as.min, assignId:as.id}); break; }
    case "occ-skip": { const as = assigns.find(x=>x.id===b.dataset.id); as.state = "skipped"; syncAll();
      if(groupOccs(assigns).some(o=>o.key===d.key)) renderF(true); else closeF(); toast("Skipped · your reminder is unchanged"); break; }
    /* work on this */
    case "plan-sel": d.sel = v; d.pickOpen = false; d.anyway = false; renderF(true); break;
    case "plan-other": d.sel = "other"; d.pickOpen = !d.pickOpen; d.pickErr = false; renderF(true); break;
    case "plan-none": d.sel = "none"; d.pickOpen = false; renderF(true); break;
    case "plan-dur": d.mins = v; d.tried = false; renderF(true); break;
    case "cal-prev": case "cal-next": { const n = new Date(d.calY,d.calM+(a==="cal-next"?1:-1),1); if(fiso(new Date(n.getFullYear(),n.getMonth()+1,0))<fiso(F_NOW)) break; d.calY = n.getFullYear(); d.calM = n.getMonth(); renderF(true); break; }
    case "pick-day": d.otherDate = v; d.pickErr = false; renderF(true); break;
    case "pick-ok": if(!d.otherDate){ d.pickErr = true; renderF(true); break; } d.pickOpen = false; renderF(true); break;
    case "plan-earlier": d.sel = null; d.pickOpen = false; renderF(true); fEl().scrollTop = 0; break;
    case "plan-anyway": case "plan-save": {
      const r = remById(d.rid);
      if(d.sel==="none"){ const cur = assigns.find(x=>x.rid===r.id && x.state==="planned"); if(cur) cur.state = "skipped"; closeF(); syncAll(); toast("Left unscheduled"); break; }
      const target = planTarget(d,planOptions(r)), mins = fMins(d.mins,d.custom);
      if(!target || isNaN(mins)){ d.tried = true; renderF(true); break; }
      const old = assigns.find(x=>x.rid===r.id && x.state==="planned"); if(old){ old.state = "moved"; old.movedTo = "n"+fSeq; }   /* one atomic move */
      assigns.push({id:"n"+(fSeq++), rid:r.id, ftId:target.ftId, date:target.date, time:target.time, min:mins, state:"planned"});
      closeF(); syncAll(); toast(`Planned for ${DAYN[target.start.getDay()]} · ${ft12(target.time)}${old?" (moved)":""}`); break; }
    case "goto-times": goF("times"); break;
    /* focus times */
    case "tz": toast("Account timezone lives in Settings"); break;
    case "edit-time": goF("timeedit",tdInit(ftById(b.dataset.id))); break;
    case "add-time": goF("timeedit",tdInit(null)); break;
    case "td-day": { const n = +v; d.days = d.days.includes(n) ? d.days.filter(x=>x!==n) : [...d.days,n]; d.err.days = ""; renderF(true); break; }
    case "td-time": d.timeOpen = !d.timeOpen; renderF(true); break;
    case "td-time-ok": d.timeOpen = false; renderF(true); break;
    case "td-mins": d.mins = v; d.err.mins = ""; renderF(true); break;
    case "td-ctx": d.ctx = v; d.err.ctx = ""; renderF(true); break;
    case "td-save": {
      const mins = fMins(d.mins,d.custom), err = {};
      if(!d.days.length) err.days = "Choose at least one day.";
      if(isNaN(mins)) err.mins = "Choose a whole number from 1 to 180 minutes.";
      if(!d.ctx) err.ctx = "Choose Work or Side Gig.";
      if(Object.keys(err).length){ d.err = err; renderF(true); break; }
      const rec = {id:d.id||"ft"+(fSeq++), label:d.label.trim(), ctx:d.ctx, days:[...d.days].sort(), time:d.time, budget:mins};
      const i = focusTimes.findIndex(f=>f.id===rec.id); if(i>=0) focusTimes[i] = rec; else focusTimes.push(rec);
      syncAll(); goF("times"); toast("Focus time saved"); break; }
    case "td-archive": { const f = ftById(d.id); f.archived = true; syncAll(); goF("times");
      toast("Focus time archived · planned work stays","Undo",()=>{ f.archived = false; syncAll(); if(fs.open&&fs.mode==="times") renderF(true); $("#toast").classList.remove("show"); }); break; }
  }
});

/* ----- Today + Settings actions ----- */
main.addEventListener("click", e=>{
  const b = e.target.closest("[data-fact]"); if(!b) return; const a = b.dataset.fact;
  if(a==="choose") openF("choose",{q:""});
  else if(a==="times") openF("times");
  else if(a==="session") openF(fstate.session.state==="timeup"?"review":"session", {outcome:null,next:"",tried:false,failed:false});
  else if(a==="start"){ const k = cardKind(); if(k==="highlight") startSession({rid:fstate.highlight.rid, minutes:fstate.pref});
    else { const o = upcomingOccs()[0], t = o.tasks[0]; startSession({rid:t.rid, minutes:t.min, assignId:t.id}); } }
  else if(a==="dur"){ const k = cardKind(), rid = k==="highlight" ? fstate.highlight.rid : upcomingOccs()[0].tasks[0].rid, t = k==="highlight" ? null : upcomingOccs()[0].tasks[0], m = String(t?t.min:fstate.pref);
    openF("setup",{rid, assignId:t&&t.id, mins:["10","25","50"].includes(m)?m:"custom", custom:m, intended:"", tried:false}); }
  else if(a==="makefocus"){ fstate.highlight = {rid:upcomingOccs()[0].tasks[0].rid}; syncAll(); toast("Today's focus set"); }
  else if(a==="occ") openF("occ",{key:b.dataset.key});
  else if(a.startsWith("m-")){
    const it = missedItems().find(x=>x.a.id===b.dataset.id); if(!it) return; const {a:as,o} = it;
    if(a==="m-start") startSession({rid:as.rid, minutes:as.min, assignId:as.id});
    else if(a==="m-next"){ as.date = fiso(new Date(o.start.getFullYear(),o.start.getMonth(),o.start.getDate()+7)); syncAll(); toast(`Planned for ${DAYN[o.start.getDay()]} · ${ft12(o.time)} (${fshort(fdate(as.date))})`); }
    else if(a==="m-other") openF("plan",planInit(as.rid));
    else if(a==="m-leave"){ as.state = "skipped"; syncAll(); toast("Left unscheduled"); }
  }
});
main.addEventListener("change", e=>{
  const t = e.target; if(!t.closest || !t.closest(".fdemo")) return;
  if(t.id==="fdState") demo.state = t.value; else if(t.id==="fdTimes") demo.times = t.checked; else if(t.id==="fdMissed") demo.missed = t.checked; else if(t.id==="fdFail") { demo.fail = t.checked; return; }
  applyDemo();
});
main.addEventListener("click", e=>{ if(e.target.id==="fdRush" && fstate.session){ fstate.session.remaining = Math.min(fstate.session.remaining,5); syncAll(); } });
main.addEventListener("toggle", e=>{ if(e.target.classList && e.target.classList.contains("fdemo")) demo.open = e.target.open; }, true);

/* reminder sheet: “Focus on this” and “Work on this” (Work + Side Gig only) */
function syncSheetFocus(r){
  const box = $("#shFocus"), ok = fEligible(r); box.style.display = ok ? "" : "none"; if(!ok) return;
  box.dataset.rid = r.id;
  const cur = assigns.find(a=>a.rid===r.id && a.state==="planned");
  $("#shPlanNote").textContent = cur ? `Planned: ${assignName(cur)} · ${cur.min} min` : "Not planned yet";
}
$("#shFocusOn").onclick = ()=>{ const rid = +$("#shFocus").dataset.rid, r = remById(rid); closeSheet();
  if(fstate.session){ openF("session"); return; }
  const m = String(fstate.pref); openF("setup",{rid, mins:["10","25","50"].includes(m)?m:"custom", custom:m, intended:"", tried:false}); };
$("#shWorkOn").onclick = ()=>{ const rid = +$("#shFocus").dataset.rid; closeSheet(); openF("plan",planInit(rid)); };

/* prototype hooks: #state=running&times=0&missed=1 (and window.fp for scripted demos) */
(function(){
  const q = new URLSearchParams(location.hash.slice(1));
  if(q.get("state")) demo.state = q.get("state"); if(q.get("times")==="0") demo.times = false; if(q.get("missed")==="1") demo.missed = true; if(q.get("demo")==="1") demo.open = true;
  resetDemoData(); window.fp = {demo, applyDemo, openF, closeF, fstate, tab:n=>document.querySelector(`.tab[data-tab="${n}"]`).click()};
})();

/* ---------- nav ---------- */
function updateShipCnt(){ const c=$("#shipCnt"); c.textContent=orders.length; c.style.display = orders.length?"":"none"; }
function render(){
  if(activeTab==="today") renderToday();
  else if(activeTab==="ship") renderShip();
  else if(activeTab==="all") renderAll();
  else if(activeTab==="home") renderHome();
  else renderSettings();
  $("#qa").style.display=activeTab==="home"?"none":"block";
  updateShipCnt();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  activeTab = t.dataset.tab;
  if (activeTab === "ship") { location.href = "sidegig-prototype.html"; return; }
  $("#screenTitle").textContent = {today:"Today", ship:"Ship Queue", home:"Home", all:"All"}[activeTab];
  $("#pills").style.display = activeTab==="all" ? "flex":"none";
  render();
});
$("#pills").querySelectorAll(".pill").forEach(p=>p.onclick=()=>{
  $("#pills").querySelectorAll(".pill").forEach(x=>x.classList.remove("active")); p.classList.add("active");
  activeCtx = p.dataset.ctx; render();
});
$("#gearBtn").onclick = ()=>{
  activeTab="settings"; $("#screenTitle").textContent="Settings"; $("#pills").style.display="none";
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); render();
};
/* keyboard shortcuts */
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="n"){ qaInput.focus(); e.preventDefault(); }
});
/* system dark mode */
if(matchMedia("(prefers-color-scheme: dark)").matches){ $("#frame").classList.add("dark"); document.body.classList.add("dark-page"); }

const initialTab = new URLSearchParams(location.hash.slice(1)).get("tab");
if (["today", "ship", "home", "all"].includes(initialTab)) document.querySelector(`.tab[data-tab="${initialTab}"]`).click();
else render();
</script>
</body>
